# Producción — archivo standalone, NO es un override (no se combina con -f
# junto a docker-compose.yml; ese es el de desarrollo, ver ese archivo).
#
# No expone el puerto de MySQL al host: `servidor` llega a `db` por la red
# interna de Compose (DB_HOST=db), así que no hay necesidad funcional de
# publicarlo, y hacerlo amplía la superficie de ataque innecesariamente.
#
# Tampoco monta el código como volumen ni corre con --reload: la imagen se
# construye con el código ya copiado dentro (servidor/Dockerfile) y uvicorn
# corre sin --reload, como en cualquier build de producción.
#
# TLS opcional (recomendado): montamos ./certs (o TLS_CERTS_DIR) como
# volumen de solo lectura en /certs; si TLS_CERT_PATH/TLS_KEY_PATH apuntan
# ahí adentro, docker-entrypoint.sh le pasa --ssl-certfile/--ssl-keyfile a
# uvicorn. Generar esos archivos con servidor/scripts/generar_ca.sh — ver
# docs/desarrollo/despliegue.md, sección TLS. Ese directorio NO debe contener
# ca.key (la clave privada de la CA): el script la deja aparte, en ./ca, y el
# entrypoint aborta si la encuentra montada.
#
# El puerto 8000 se publica solo en la IP de la LAN que indique SERVER_BIND_IP
# (obligatoria), no en 0.0.0.0: Docker inserta sus propias reglas de iptables
# para los puertos publicados y esas reglas se saltan UFW/firewalld, así que
# un `ufw deny 8000` en el host NO bloquea el acceso. Atando el puerto a una
# sola interfaz, la API no queda expuesta en otras redes del host (Wi-Fi de
# invitados, otra NIC, VPN) aunque el operador crea que el firewall la cubre.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Endurecimiento: los dos servicios corren con no-new-privileges (ningún
# binario setuid puede elevar privilegios) y límite de procesos. `servidor`
# además corre sin ninguna capability de Linux y con el sistema de archivos
# de solo lectura (solo /tmp en memoria es escribible): la app no escribe a
# disco, así que quien lograra ejecutar código no podría modificar el código
# ni dejar archivos persistentes. `db` conserva las capabilities por defecto
# porque el entrypoint de MySQL las necesita para preparar el datadir y
# cambiar al usuario mysql.
#
# deploy.resources.limits en ambos servicios acota CPU/memoria por contenedor
# (soportado por `docker compose up` sin Swarm en Compose v2) para que un pico
# de tráfico, una fuga de memoria o un contenedor con problemas no agote los
# recursos del host. Ajustado al tamaño esperado del despliegue (16 kioscos,
# tráfico bajo); subir si el uso real se acerca al límite.

# Los logs de ambos contenedores (stdout) rotan a 5 archivos de 10 MB: el
# driver json-file de Docker no rota por defecto y, en un servicio que corre
# meses, crecería hasta llenar el disco de la PC maestra.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/El_Salvador
    volumes:
      - db_data:/var/lib/mysql
      # Recorta los privilegios del usuario de la app (solo al crear el volumen).
      - ./servidor/scripts/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Sin credenciales: `mysqladmin ping` sale con 0 si el servidor responde,
      # aunque rechace el login, así que la contraseña de root no tiene por qué
      # quedar en el comando (visible en `docker inspect`). Por TCP (127.0.0.1)
      # y no por socket, para no dar por sano al servidor temporal sin red que
      # la imagen levanta mientras inicializa la base.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 512

  servidor:
    build: ./servidor
    restart: unless-stopped
    logging: *logging
    ports:
      - "${SERVER_BIND_IP:?definir SERVER_BIND_IP en .env (IP de la PC maestra en la LAN de los kioscos)}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH}
      KIOSK_API_KEY: ${KIOSK_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS}
      LOGIN_BLOQUEO_MINUTOS: ${LOGIN_BLOQUEO_MINUTOS}
      MAX_BODY_SIZE_BYTES: ${MAX_BODY_SIZE_BYTES}
      SYNC_MAX_SESIONES: ${SYNC_MAX_SESIONES}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS}
      ENABLE_METRICS: ${ENABLE_METRICS}
      TZ: America/El_Salvador
      # TLS entre los kioscos y este servidor (docs/desarrollo/despliegue.md
      # sección TLS) — rutas DENTRO del contenedor, generadas con
      # servidor/scripts/generar_ca.sh y montadas desde TLS_CERTS_DIR abajo.
      # Vacías = uvicorn sirve HTTP plano, como hasta ahora.
      TLS_CERT_PATH: ${TLS_CERT_PATH}
      TLS_KEY_PATH: ${TLS_KEY_PATH}
      # true si el TLS del panel lo termina un proxy/túnel delante (p. ej.
      # Cloudflare Tunnel): fuerza `Secure` en las cookies y activa HSTS.
      BEHIND_HTTPS_PROXY: ${BEHIND_HTTPS_PROXY}
      # CA para cifrar servidor→MySQL — vacía = sin efecto mientras "db" y
      # "servidor" compartan esta red interna de Compose (caso actual). Solo
      # hace falta si la base de datos se aloja fuera de esta red; puede
      # apuntar dentro de /certs, reutilizando el mismo volumen de abajo.
      DB_SSL_CA: ${DB_SSL_CA}
    volumes:
      - ${TLS_CERTS_DIR:-./certs}:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128

volumes:
  db_data:

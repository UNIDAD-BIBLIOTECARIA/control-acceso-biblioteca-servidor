<div class="tab-toolbar">
    <span class="tab-title">Estudiantes registrados</span>
    <input type="text" id="filter-est" placeholder="Buscar nombre, carnet o carrera...">
    <button id="btn-nuevo-est" class="btn-danger">+ Nuevo estudiante</button>
</div>

<div class="table-wrap student-table-wrap">
    <table class="student-table">
        <thead>
            <tr>
                <th>Carnet</th>
                <th>Nombre</th>
                <th>Carrera</th>
                <th>Facultad</th>
                <th>Sexo</th>
                <th>Registro</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-est-body"></tbody>
    </table>
    <p id="no-est" class="empty-msg hidden">Sin estudiantes registrados.</p>
</div>

<!-- Modal -->
<div id="modal-est" class="modal-overlay hidden">
    <div class="modal-box">
        <h3 id="modal-est-titulo">Nuevo estudiante</h3>
        <div class="modal-form">
            <label>Carnet *
                <input type="text" id="est-carnet" placeholder="mv23036">
            </label>
            <label>Nombre *
                <input type="text" id="est-nombre" placeholder="Nombre completo">
            </label>
            <label>Facultad
                <input type="text" id="est-facultad" list="dl-est-facultades" autocomplete="off"
                       placeholder="Departamento de Ingeniería y Arquitectura">
                <datalist id="dl-est-facultades"></datalist>
            </label>
            <label>Carrera
                <input type="text" id="est-carrera" list="dl-est-carreras" autocomplete="off"
                       placeholder="Ingeniería en Sistemas Informáticos">
                <datalist id="dl-est-carreras"></datalist>
            </label>
            <label>Año de nacimiento
                <input type="number" id="est-fecha-nac" min="1901" max="2155" placeholder="2004">
            </label>
            <label>Sexo
                <select id="est-sexo">
                    <option value="">— Seleccionar —</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                </select>
            </label>
        </div>
        <p id="modal-est-error" class="error"></p>
        <div class="modal-actions">
            <button id="btn-est-guardar" class="btn-danger">Guardar</button>
            <button id="btn-est-cancelar" class="btn-secondary">Cancelar</button>
        </div>
    </div>
</div>

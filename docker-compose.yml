# Desarrollo — configuración por defecto de `docker compose up`.
#
# Monta ./servidor como volumen y corre uvicorn con --reload, así que los
# cambios en el código se reflejan sin reconstruir la imagen. La API se
# publica solo en 127.0.0.1:8000. Publica además
# el puerto 3306 de MySQL en 127.0.0.1 del host para poder conectarte directo
# (MySQL Workbench, `mysql` CLI, backups manuales, etc.) durante desarrollo
# local, sin exponerlo al resto de la red (bind solo a loopback).
#
# Para producción usa el archivo standalone docker-compose.prod.yml (no se
# combina con este vía -f, es autosuficiente):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# dns_search: [.] en ambos servicios evita que se herede el search domain
# de Tailscale (p. ej. "taile278cb.ts.net") desde /etc/resolv.conf del host.
# Sin esto, el resolver de glibc en el contenedor `servidor` intenta primero
# "db.<search-domain>" contra el DNS de Tailscale antes que el nombre "db"
# simple, y esa consulta externa cuelga/falla, provocando
# "Temporary failure in name resolution" y un crash-loop al conectar a MySQL.
#
# deploy.resources.limits en ambos servicios acota CPU/memoria por contenedor
# (soportado por `docker compose up` sin Swarm en Compose v2) para que un pico
# de tráfico, una fuga de memoria o un contenedor con problemas no agote los
# recursos del host. Ajustado al tamaño esperado del despliegue (16 kioscos,
# tráfico bajo); subir si el uso real se acerca al límite.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/El_Salvador
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Recorta los privilegios del usuario de la app (solo al crear el volumen).
      - ./servidor/scripts/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Sin credenciales: `mysqladmin ping` sale con 0 si el servidor responde,
      # aunque rechace el login, así que la contraseña de root no tiene por qué
      # quedar en el comando (visible en `docker inspect`). Por TCP (127.0.0.1)
      # y no por socket, para no dar por sano al servidor temporal sin red que
      # la imagen levanta mientras inicializa la base.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    dns_search:
      - .
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  servidor:
    build: ./servidor
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Solo en loopback: este compose corre con --reload y el código montado
    # como volumen, y no debe quedar accesible desde la LAN si se levanta por
    # error en la PC maestra. Para probar con un kiosko real, usá el de
    # producción o cambiá temporalmente el bind a la IP de la LAN.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH}
      KIOSK_API_KEY: ${KIOSK_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS}
      LOGIN_BLOQUEO_MINUTOS: ${LOGIN_BLOQUEO_MINUTOS}
      MAX_BODY_SIZE_BYTES: ${MAX_BODY_SIZE_BYTES}
      SYNC_MAX_SESIONES: ${SYNC_MAX_SESIONES}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS}
      ENABLE_METRICS: ${ENABLE_METRICS}
      TZ: America/El_Salvador
    volumes:
      - ./servidor:/app
    dns_search:
      - .
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  db_data:
